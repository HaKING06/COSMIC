  <!-- ════════════════════════════════════════════════════════════════════ -->

  <!-- Outer Cyber Frame -->
  <rect x="24" y="22" width="1152" height="586" rx="14" fill="none" stroke="#00f0ff" stroke-opacity="0.28" stroke-width="1.5"/>
  <path d="M 24 60 L 24 34 Q 24 22 36 22 L 70 22" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
  <path d="M 1176 60 L 1176 34 Q 1176 22 1164 22 L 1130 22" fill="none" stroke="#ff006a" stroke-width="3.5"/>
  <path d="M 24 570 L 24 596 Q 24 608 36 608 L 70 608" fill="none" stroke="#00ff88" stroke-width="3.5"/>
  <path d="M 1176 570 L 1176 596 Q 1176 608 1164 608 L 1130 608" fill="none" stroke="#ffd700" stroke-width="3.5"/>

  <!-- Top Version Pill -->
  <g transform="translate(600, 58)">
    <rect x="-250" y="-18" width="500" height="32" rx="16" fill="#090418" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="0" y="3" text-anchor="middle" font-family="Orbitron, monospace" font-size="13" font-weight="800" fill="#00f0ff" letter-spacing="3">⚡ v7.0 VAMPIRE SURVIVORS &amp; MEGABONK EDITION ⚡</text>
