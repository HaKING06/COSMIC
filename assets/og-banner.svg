    <text x="0" y="62" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="10" font-weight="700" fill="#ffcc44" letter-spacing="1">DREADNOUGHT</text>
  </g>

  <!-- 5. SOLAR FLARE (Far Right - Sunstorm Radiation Phoenix) -->
  <g transform="translate(990, 355) rotate(14) scale(1.15)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="44" fill="#ff5500" fill-opacity="0.12" stroke="#ff5500" stroke-width="1.5" stroke-opacity="0.5"/>
