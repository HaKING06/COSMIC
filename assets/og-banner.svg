<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#14082e"/>
      <stop offset="45%" stop-color="#070314"/>
      <stop offset="100%" stop-color="#020106"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#bf00ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff006a"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#bf00ff" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#coreGlow)"/>

  <!-- Hyperspace Perspective Grid -->
  <g stroke="url(#gridFade)" stroke-width="1" opacity="0.75">
    <line x1="0" y1="430" x2="1200" y2="430"/>
    <line x1="0" y1="465" x2="1200" y2="465"/>
    <line x1="0" y1="505" x2="1200" y2="505"/>
    <line x1="0" y1="555" x2="1200" y2="555"/>
    <line x1="0" y1="610" x2="1200" y2="610"/>
    <line x1="600" y1="360" x2="-200" y2="630"/>
    <line x1="600" y1="360" x2="50" y2="630"/>
    <line x1="600" y1="360" x2="300" y2="630"/>
    <line x1="600" y1="360" x2="500" y2="630"/>
    <line x1="600" y1="360" x2="700" y2="630"/>
    <line x1="600" y1="360" x2="900" y2="630"/>
    <line x1="600" y1="360" x2="1150" y2="630"/>
    <line x1="600" y1="360" x2="1400" y2="630"/>
  </g>

  <!-- Hyperspace Warp Streaks -->
  <g stroke-linecap="round" opacity="0.55">
    <line x1="80" y1="60" x2="180" y2="110" stroke="#00f0ff" stroke-width="2"/>
    <line x1="1120" y1="70" x2="1010" y2="120" stroke="#ff006a" stroke-width="2"/>
    <line x1="60" y1="260" x2="150" y2="275" stroke="#bf00ff" stroke-width="1.5"/>
    <line x1="1140" y1="250" x2="1040" y2="268" stroke="#ffd700" stroke-width="1.5"/>
    <circle cx="240" cy="80" r="2" fill="#fff"/>
    <circle cx="960" cy="90" r="2.5" fill="#00f0ff"/>
    <circle cx="420" cy="55" r="1.8" fill="#ffd700"/>
    <circle cx="790" cy="65" r="2" fill="#ff006a"/>
    <circle cx="140" cy="180" r="1.5" fill="#fff"/>
    <circle cx="1060" cy="190" r="1.8" fill="#00ff88"/>
  </g>

  <!-- Background Skill Tree Constellation Network (X + Y = Z -> MEGA) -->
  <g opacity="0.32" filter="url(#neonGlow)">
    <path d="M 210 340 Q 390 250 600 290" fill="none" stroke="#ff006a" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 395 315 Q 500 240 600 290" fill="none" stroke="#bf00ff" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 805 315 Q 700 240 600 290" fill="none" stroke="#ffaa00" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 990 340 Q 810 250 600 290" fill="none" stroke="#ff5500" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- ════════════════════════════════════════════════════════════════════ -->
