  <!-- ════════════════════════════════════════════════════════════════════ -->

  <!-- 1. VOID PHANTOM (Far Left - Stealth Assassin Wing) -->
  <g transform="translate(210, 355) rotate(-14) scale(1.15)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="42" fill="#ff006a" fill-opacity="0.08" stroke="#ff006a" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <!-- Thruster -->
