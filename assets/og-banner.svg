  <text x="600" y="176" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="20" font-weight="800" fill="url(#titleGold)" letter-spacing="5">1P SPACE BULLET-HEAVEN • BRANCHING EVOLUTION MATRIX</text>

  <!-- Bottom Feature Badges -->
  <g transform="translate(600, 515)" font-family="Orbitron, monospace" font-size="12" font-weight="800">
    <g transform="translate(-435, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="8" fill="#081326" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#00f0ff" letter-spacing="1">🛸 5 ÖZEL GEMİ &amp; KÖK AĞACI</text>
    </g>
    <g transform="translate(-145, 0)">
      <rect x="-135" y="-18" width="270" height="36" rx="8" fill="#1c0826" stroke="#bf00ff" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#e088ff" letter-spacing="1">🧬 ÇAPRAZ FÜZYON (X + Y = Z)</text>
    </g>
    <g transform="translate(155, 0)">
      <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#261406" stroke="#ffd700" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#ffd700" letter-spacing="1">👑 KOZMİK MEGA EVRİM (Z+N)</text>
    </g>
    <g transform="translate(440, 0)">
      <rect x="-115" y="-18" width="230" height="36" rx="8" fill="#062218" stroke="#00ff88" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" fill="#00ff88" letter-spacing="1">🗺️ 3 ANOMALİ HARİTASI</text>
    </g>
  </g>

  <!-- Footer URL -->
  <text x="600" y="582" text-anchor="middle" font-family="Orbitron, monospace" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="4" opacity="0.9">HTTPS://COSMIC.HAKING.TR</text>
</svg>