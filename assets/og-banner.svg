    <polygon points="0,-18 -12,10 0,4 12,10" fill="#ff006a" opacity="0.85"/>
    <text x="0" y="64" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="10" font-weight="700" fill="#ff66a3" letter-spacing="1">VOID PHANTOM</text>
  </g>

  <!-- 2. AEGIS (Mid Left - Shield Guardian Disc Carrier) -->
  <g transform="translate(395, 325) rotate(-7) scale(1.2)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="46" fill="#bf00ff" fill-opacity="0.1" stroke="#bf00ff" stroke-width="1.5" stroke-dasharray="8 4"/>
