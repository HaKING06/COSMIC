<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
        
    <defs>
        <filter id="esh-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="esh-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#cc44ff" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="esh-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="esh-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="esh-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#cc44ff"/>
            <stop offset="80%" stop-color="#5500aa"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="esh-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#cc44ff"/>
            <stop offset="50%" stop-color="#5500aa"/>
            <stop offset="100%" stop-color="#cc44ff"/>
        </linearGradient>
        <radialGradient id="esh-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#5500aa" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#5500aa" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="esh-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#cc44ff" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#5500aa" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="esh-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#cc44ff"/>
            <stop offset="70%" stop-color="#5500aa" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#5500aa" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="esh-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#cc44ff" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#5500aa" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <g filter="url(#esh-shadow)">
            <rect x="42" y="10" width="8" height="36" rx="3" fill="#cc44ff"/>
            <rect x="78" y="10" width="8" height="36" rx="3" fill="#cc44ff"/>
            <polygon points="64,24 112,68 96,108 64,94 32,108 16,68" fill="url(#esh-hull)" stroke="#cc44ff" stroke-width="2.5"/>
            <polygon points="64,36 96,68 84,94 64,84 44,94 32,68" fill="url(#esh-plate)" stroke="#e599ff" stroke-width="1.5"/>
            <circle cx="64" cy="66" r="14" fill="url(#esh-core)" filter="url(#esh-glow)"/>
        </g>
    </svg>