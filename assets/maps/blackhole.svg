            </radialGradient>
        </defs>
        <rect width="640" height="360" fill="url(#bh-bg)"/>
        <!-- Accretion Disk & Singularity -->
        <circle cx="320" cy="180" r="165" fill="url(#bh-disk)"/>
        <ellipse cx="320" cy="180" rx="220" ry="58" transform="rotate(-14 320 180)" fill="none" stroke="#ffaa00" stroke-width="6" opacity="0.85"/>
        <ellipse cx="320" cy="180" rx="185" ry="42" transform="rotate(-14 320 180)" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
        <circle cx="320" cy="180" r="38" fill="#000000" stroke="#ff6600" stroke-width="3"/>
        <rect x="16" y="16" width="608" height="328" rx="14" fill="none" stroke="#ff5500" stroke-width="2" stroke-opacity="0.5"/>
