                <stop offset="0%" stop-color="#080104"/>
                <stop offset="50%" stop-color="#1c0408"/>
                <stop offset="100%" stop-color="#2c0904"/>
            </linearGradient>
            <radialGradient id="bh-disk" cx="50%" cy="50%" r="48%">
                <stop offset="0%" stop-color="#000000"/>
                <stop offset="22%" stop-color="#000000"/>
                <stop offset="28%" stop-color="#ffffff"/>
                <stop offset="42%" stop-color="#ff8800" stop-opacity="0.9"/>
                <stop offset="68%" stop-color="#ff2200" stop-opacity="0.35"/>
