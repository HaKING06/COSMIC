<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
        <defs>
            <linearGradient id="s9-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#030511"/>
                <stop offset="55%" stop-color="#09152b"/>
                <stop offset="100%" stop-color="#042438"/>
            </linearGradient>
            <radialGradient id="s9-planet" cx="75%" cy="28%" r="40%">
                <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
                <stop offset="50%" stop-color="#0055aa" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <rect width="640" height="360" fill="url(#s9-bg)"/>
        <rect width="640" height="360" fill="url(#s9-planet)"/>
        <!-- Tactical Cyber Grid -->
        <g stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1">
            <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="300" x2="640" y2="300"/>
            <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/><line x1="560" y1="0" x2="560" y2="360"/>
        </g>
        <!-- Derelict Orbital Dreadnought Wreckage Silhouette -->
        <g fill="#122438" stroke="#00f0ff" stroke-width="2" opacity="0.85">
            <polygon points="80,220 260,140 310,165 280,235 120,270"/>
            <polygon points="350,110 520,60 570,115 430,175"/>
            <polygon points="420,230 560,210 590,275 460,295"/>
            <line x1="140" y1="205" x2="250" y2="165" stroke="#00f0ff" stroke-width="3"/>
        </g>
        <!-- Floating Scrap & Beacon Lights -->
        <circle cx="210" cy="185" r="5" fill="#00f0ff"/>
        <circle cx="460" cy="115" r="6" fill="#ffaa00"/>
        <circle cx="510" cy="250" r="4" fill="#00f0ff"/>
