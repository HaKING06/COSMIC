<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="beh-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="beh-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff6600" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="beh-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="beh-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="beh-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#ff6600"/>
            <stop offset="80%" stop-color="#ffaa00"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="beh-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6600"/>
            <stop offset="50%" stop-color="#ffaa00"/>
            <stop offset="100%" stop-color="#ff6600"/>
        </linearGradient>
        <radialGradient id="beh-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#00f0ff"/>
            <stop offset="75%" stop-color="#ffaa00" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="beh-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6600" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#ffaa00" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="beh-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#ff6600"/>
            <stop offset="70%" stop-color="#ffaa00" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="beh-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#ff6600" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="120" fill="url(#beh-aura)"/>
        <!-- Front Golden Deflector Shield Arc (Top/Front) -->
        <path d="M 22,108 A 110,110 0 0,1 234,108" fill="none" stroke="#ffd700" stroke-width="12" stroke-linecap="round" filter="url(#beh-glow)"/>
        <path d="M 32,114 A 98,98 0 0,1 224,114" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 8"/>
        <g filter="url(#beh-shadow)">
            <!-- Massive Dreadnought Parasite Carapace -->
            <polygon points="84,34 172,34 226,84 236,154 196,214 158,202 128,224 98,202 60,214 20,154 30,84" fill="url(#beh-hull)" stroke="#ff6600" stroke-width="3"/>
            <!-- Heavy Armored Mandibles & Siege Cannons -->
            <polygon points="64,24 96,14 108,58 52,68" fill="url(#beh-accent)" stroke="#ffd700" stroke-width="2"/>
            <polygon points="192,24 160,14 148,58 204,68" fill="url(#beh-accent)" stroke="#ffd700" stroke-width="2"/>
            <!-- Segmented Armor Plates -->
            <polygon points="50,82 206,82 216,136 40,136" fill="url(#beh-plate)" stroke="#ffaa00" stroke-width="2"/>
            <polygon points="62,140 194,140 180,184 76,184" fill="url(#beh-plate)" stroke="#ff5500" stroke-width="2"/>
            <!-- Exposed Glowing Blue Rear Reactor Core (Weak Spot!) -->
            <circle cx="128" cy="196" r="28" fill="#041528" stroke="#00f0ff" stroke-width="3"/>
            <circle cx="128" cy="196" r="22" fill="url(#beh-core)" filter="url(#beh-glow)"/>
            <circle cx="128" cy="196" r="10" fill="#ffffff"/>
            <!-- Central Hellfire Eye -->
            <circle cx="128" cy="108" r="24" fill="#220500" stroke="#ffaa00" stroke-width="2.5"/>
            <polygon points="128,88 144,108 128,128 112,108" fill="#ff3300" filter="url(#beh-glow)"/>
            <polygon points="128,96 136,108 128,120 120,108" fill="#ffffaa"/>
        </g>
    </svg>