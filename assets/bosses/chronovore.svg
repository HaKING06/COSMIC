<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="chv-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="chv-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00ffcc" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="chv-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="chv-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="chv-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#00ffcc"/>
            <stop offset="80%" stop-color="#9900ff"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="chv-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc"/>
            <stop offset="50%" stop-color="#9900ff"/>
            <stop offset="100%" stop-color="#00ffcc"/>
        </linearGradient>
        <radialGradient id="chv-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#9900ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="chv-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#9900ff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="chv-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#00ffcc"/>
            <stop offset="70%" stop-color="#9900ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="chv-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#00ffcc" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="122" fill="url(#chv-aura)"/>
        <g filter="url(#chv-shadow)">
            <!-- Outer Clockwork Singularity Gear Ring -->
            <circle cx="128" cy="128" r="102" fill="none" stroke="#00ffcc" stroke-width="6" stroke-dasharray="16 10"/>
            <circle cx="128" cy="128" r="88" fill="none" stroke="url(#chv-trim)" stroke-width="10"/>
            <!-- 4 Dimensional Rift Pylons -->
            <polygon points="128,8 148,54 128,44 108,54" fill="url(#chv-accent)" stroke="#ffffff" stroke-width="1.5"/>
            <polygon points="248,128 202,148 212,128 202,108" fill="url(#chv-accent)" stroke="#ffffff" stroke-width="1.5"/>
            <polygon points="128,248 148,202 128,212 108,202" fill="url(#chv-accent)" stroke="#ffffff" stroke-width="1.5"/>
            <polygon points="8,128 54,148 44,128 54,108" fill="url(#chv-accent)" stroke="#ffffff" stroke-width="1.5"/>
            <!-- Counter-Rotating Inner Sacred Geometry -->
            <polygon points="128,42 202,172 54,172" fill="none" stroke="#00ffcc" stroke-width="3.5" opacity="0.85"/>
            <polygon points="128,214 202,84 54,84" fill="none" stroke="#bf00ff" stroke-width="3.5" opacity="0.85"/>
            <!-- Event Horizon Core & Clock Hands -->
            <circle cx="128" cy="128" r="42" fill="#04000c" stroke="#00ffcc" stroke-width="3"/>
            <circle cx="128" cy="128" r="32" fill="url(#chv-core)" filter="url(#chv-glow)"/>
            <line x1="128" y1="128" x2="128" y2="74" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            <line x1="128" y1="128" x2="168" y2="144" stroke="#00ffcc" stroke-width="3" stroke-linecap="round"/>
            <circle cx="128" cy="128" r="8" fill="#ffffff"/>
        </g>
    </svg>