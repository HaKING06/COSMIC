<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="hiv-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="hiv-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff006a" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="hiv-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="hiv-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="hiv-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#ff006a"/>
            <stop offset="80%" stop-color="#ffaa00"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="hiv-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff006a"/>
            <stop offset="50%" stop-color="#ffaa00"/>
            <stop offset="100%" stop-color="#ff006a"/>
        </linearGradient>
        <radialGradient id="hiv-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ff66b2"/>
            <stop offset="75%" stop-color="#ffaa00" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="hiv-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff006a" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#ffaa00" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hiv-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#ff006a"/>
            <stop offset="70%" stop-color="#ffaa00" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hiv-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#ff006a" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="120" fill="url(#hiv-aura)"/>
        <g filter="url(#hiv-shadow)">
            <!-- Crystalline Carrier Octagon Hull -->
            <polygon points="92,18 164,18 228,72 238,148 184,224 72,224 18,148 28,72" fill="url(#hiv-hull)" stroke="#ff006a" stroke-width="3"/>
            <polygon points="102,36 154,36 208,82 214,142 170,204 86,204 42,142 48,82" fill="url(#hiv-plate)" stroke="#ffaa00" stroke-width="2"/>
            <!-- 6 Glowing Incubation Spawning Pods -->
            <g stroke="#ffffff" stroke-width="1.5" filter="url(#hiv-glow)">
                <ellipse cx="72" cy="84" rx="18" ry="12" fill="#ff006a"/>
                <ellipse cx="184" cy="84" rx="18" ry="12" fill="#ff006a"/>
                <ellipse cx="64" cy="134" rx="20" ry="13" fill="#ff6600"/>
                <ellipse cx="192" cy="134" rx="20" ry="13" fill="#ff6600"/>
                <ellipse cx="82" cy="180" rx="16" ry="11" fill="#ff006a"/>
                <ellipse cx="174" cy="180" rx="16" ry="11" fill="#ff006a"/>
            </g>
            <!-- Central Neural Queen Synapse Matrix -->
            <polygon points="128,58 168,98 154,162 102,162 88,98" fill="#1a0518" stroke="#ffd700" stroke-width="2.5"/>
            <circle cx="128" cy="116" r="28" fill="url(#hiv-core)" filter="url(#hiv-glow)"/>
            <polygon points="128,90 150,116 128,142 106,116" fill="#ffffff" opacity="0.85"/>
        </g>
    </svg>