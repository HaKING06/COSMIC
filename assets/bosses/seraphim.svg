<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="ser-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="ser-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd700" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="ser-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="ser-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="ser-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#ffd700"/>
            <stop offset="80%" stop-color="#ff0055"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="ser-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffd700"/>
            <stop offset="50%" stop-color="#ff0055"/>
            <stop offset="100%" stop-color="#ffd700"/>
        </linearGradient>
        <radialGradient id="ser-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#ff0055" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ser-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffd700" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#ff0055" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ser-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#ffd700"/>
            <stop offset="70%" stop-color="#ff0055" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ff0055" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="ser-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#ffd700" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ff0055" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="122" fill="url(#ser-aura)"/>
        <g filter="url(#ser-shadow)">
            <!-- 6 Mechanical Solar-Blade Wings (3 Left, 3 Right) -->
            <!-- Upper Wing Pair -->
            <polygon points="116,96 18,22 10,64 96,114" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <polygon points="140,96 238,22 246,64 160,114" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <!-- Middle Wing Pair -->
            <polygon points="112,122 6,104 18,146 102,142" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <polygon points="144,122 250,104 238,146 154,142" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <!-- Lower Wing Pair -->
            <polygon points="116,148 28,198 54,228 112,172" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <polygon points="140,148 228,198 202,228 144,172" fill="url(#ser-accent)" stroke="#ffd700" stroke-width="2"/>
            <!-- Corrupted Dyson Halo Ring -->
            <circle cx="128" cy="64" r="36" fill="none" stroke="#ffd700" stroke-width="5" filter="url(#ser-glow)"/>
            <!-- Seraphim Central Chassis -->
            <polygon points="128,24 152,88 144,196 128,238 112,196 104,88" fill="url(#ser-plate)" stroke="#ffffff" stroke-width="2.2"/>
            <!-- All-Seeing Dyson Core Eye -->
            <circle cx="128" cy="128" r="28" fill="#1a000c" stroke="#ffd700" stroke-width="3"/>
            <circle cx="128" cy="128" r="20" fill="url(#ser-core)" filter="url(#ser-glow)"/>
            <polygon points="108,128 128,114 148,128 128,142" fill="#ff0055"/>
            <circle cx="128" cy="128" r="7" fill="#ffffff"/>
        </g>
    </svg>