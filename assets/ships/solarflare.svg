<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="sol-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="sol-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff6600" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="sol-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="sol-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="sol-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#ff6600"/>
            <stop offset="80%" stop-color="#ffcc00"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="sol-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6600"/>
            <stop offset="50%" stop-color="#ffcc00"/>
            <stop offset="100%" stop-color="#ff6600"/>
        </linearGradient>
        <radialGradient id="sol-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#ffcc00" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sol-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff6600" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#ffcc00" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sol-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#ff6600"/>
            <stop offset="70%" stop-color="#ffcc00" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ffcc00" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="sol-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#ff6600" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ffcc00" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="118" fill="url(#sol-aura)"/>
        <!-- Solar Corona Plume -->
        <g filter="url(#sol-glow)">
            <polygon points="94,198 112,246 128,218 144,246 162,198" fill="url(#sol-plume)"/>
            <polygon points="112,198 128,254 144,198" fill="#ffffff"/>
        </g>
        <g filter="url(#sol-shadow)">
            <!-- Phoenix Solar Pinions (Multi-feathered Radiators) -->
            <polygon points="128,88 244,54 218,108 242,126 202,158 214,182 152,172" fill="url(#sol-accent)" stroke="#ffcc00" stroke-width="2"/>
            <polygon points="128,88 12,54 38,108 14,126 54,158 42,182 104,172" fill="url(#sol-accent)" stroke="#ffcc00" stroke-width="2"/>
            <!-- Main Solar Cruiser Hull -->
            <polygon points="128,14 156,74 198,112 168,184 144,212 128,196 112,212 88,184 58,112 100,74" fill="url(#sol-hull)" stroke="#ff8800" stroke-width="2.2"/>
            <polygon points="128,28 148,82 178,116 154,174 128,190 102,174 78,116 108,82" fill="url(#sol-plate)" stroke="#ffcc00" stroke-width="1.6"/>
            <!-- Glowing Thermal Vents -->
            <g fill="#ffcc00" filter="url(#sol-glow)">
                <polygon points="88,116 62,98 68,112 92,126"/>
                <polygon points="84,136 54,124 60,138 88,148"/>
                <polygon points="168,116 194,98 188,112 164,126"/>
                <polygon points="172,136 202,124 196,138 168,148"/>
            </g>
            <!-- Fusion Heart Reactor Core -->
            <circle cx="128" cy="134" r="26" fill="#240800" stroke="#ffaa00" stroke-width="2.5"/>
            <circle cx="128" cy="134" r="20" fill="url(#sol-core)" filter="url(#sol-glow)"/>
            <polygon points="128,110 135,126 152,134 135,142 128,158 121,142 104,134 121,126" fill="#ffffff"/>
            <!-- Phoenix Crest Canopy -->
            <polygon points="128,44 142,82 128,102 114,82" fill="url(#sol-glass)" stroke="#ffffff" stroke-width="1.6"/>
        </g>
    </svg>