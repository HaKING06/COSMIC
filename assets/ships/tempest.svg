<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="tmp-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="tmp-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00d8ff" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="tmp-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="tmp-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="tmp-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#00d8ff"/>
            <stop offset="80%" stop-color="#a8f0ff"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="tmp-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d8ff"/>
            <stop offset="50%" stop-color="#a8f0ff"/>
            <stop offset="100%" stop-color="#00d8ff"/>
        </linearGradient>
        <radialGradient id="tmp-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#a8f0ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#a8f0ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tmp-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#a8f0ff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="tmp-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#00d8ff"/>
            <stop offset="70%" stop-color="#a8f0ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#a8f0ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="tmp-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#00d8ff" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#a8f0ff" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="114" fill="url(#tmp-aura)"/>
        <!-- Cryo-Ion Plumes -->
        <g filter="url(#tmp-glow)">
            <polygon points="88,200 100,248 112,200" fill="url(#tmp-plume)"/>
            <polygon points="144,200 156,248 168,200" fill="url(#tmp-plume)"/>
            <!-- Lightning Arcs Between Forward Coils -->
            <path d="M88,36 L108,26 L128,38 L148,24 L168,36" stroke="#ffffff" stroke-width="2.5" fill="none"/>
            <path d="M90,52 L116,44 L140,56 L166,52" stroke="#00f0ff" stroke-width="2" fill="none"/>
        </g>
        <g filter="url(#tmp-shadow)">
            <!-- Forward Tesla Arc Coils (Twin Prongs) -->
            <polygon points="82,22 98,22 104,96 76,96" fill="url(#tmp-plate)" stroke="#00e5ff" stroke-width="2"/>
            <polygon points="158,22 174,22 180,96 152,96" fill="url(#tmp-plate)" stroke="#00e5ff" stroke-width="2"/>
            <!-- Copper/Ice Coil Rings -->
            <g fill="#a8f0ff" stroke="#0088cc" stroke-width="1">
                <rect x="74" y="34" width="32" height="6" rx="3"/><rect x="74" y="50" width="32" height="6" rx="3"/><rect x="74" y="66" width="32" height="6" rx="3"/>
                <rect x="150" y="34" width="32" height="6" rx="3"/><rect x="150" y="50" width="32" height="6" rx="3"/><rect x="150" y="66" width="32" height="6" rx="3"/>
            </g>
            <!-- Storm Corvette Crystalline Hull -->
            <polygon points="128,48 164,84 236,132 212,178 168,170 158,208 98,208 88,170 44,178 20,132 92,84" fill="url(#tmp-hull)" stroke="#70eaff" stroke-width="2.2"/>
            <polygon points="128,60 158,94 214,134 196,162 154,156 144,196 112,196 102,156 60,162 42,134 98,94" fill="url(#tmp-plate)" stroke="#ffffff" stroke-width="1.5"/>
            <!-- Frost Emitter Fins -->
            <polygon points="48,136 88,114 96,142 58,154" fill="url(#tmp-accent)"/>
            <polygon points="208,136 168,114 160,142 198,154" fill="url(#tmp-accent)"/>
            <!-- Cryo-Reactor & Canopy -->
            <polygon points="128,74 144,104 128,136 112,104" fill="url(#tmp-glass)" stroke="#ffffff" stroke-width="1.6"/>
            <circle cx="128" cy="164" r="18" fill="url(#tmp-core)" filter="url(#tmp-glow)"/>
            <polygon points="128,146 134,158 146,164 134,170 128,182 122,170 110,164 122,158" fill="#ffffff"/>
        </g>
    </svg>