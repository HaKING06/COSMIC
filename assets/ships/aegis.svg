<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="aeg-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="aeg-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00ffcc" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="aeg-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="aeg-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="aeg-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#00ffcc"/>
            <stop offset="80%" stop-color="#9900ff"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="aeg-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ffcc"/>
            <stop offset="50%" stop-color="#9900ff"/>
            <stop offset="100%" stop-color="#00ffcc"/>
        </linearGradient>
        <radialGradient id="aeg-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffffff"/>
            <stop offset="75%" stop-color="#9900ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="aeg-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#9900ff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="aeg-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#00ffcc"/>
            <stop offset="70%" stop-color="#9900ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="aeg-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#00ffcc" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#9900ff" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="116" fill="url(#aeg-aura)"/>
        <!-- Hexagonal Energy Shield Lattice -->
        <polygon points="128,12 228,70 228,186 128,244 28,186 28,70" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-dasharray="14 6" opacity="0.75" filter="url(#aeg-glow)"/>
        <polygon points="128,26 216,77 216,179 128,230 40,179 40,77" fill="none" stroke="#bf00ff" stroke-width="1.5" opacity="0.5"/>
        <!-- Thruster Plumes -->
        <g filter="url(#aeg-glow)">
            <polygon points="104,206 128,250 152,206" fill="url(#aeg-plume)"/>
        </g>
        <g filter="url(#aeg-shadow)">
            <!-- Rotating Outer Energy Ring -->
            <circle cx="128" cy="128" r="78" fill="none" stroke="url(#aeg-trim)" stroke-width="10" opacity="0.9"/>
            <circle cx="128" cy="128" r="78" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="18 12"/>
            <!-- 6 Shield Projector Pylons -->
            <polygon points="128,18 148,74 128,92 108,74" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <polygon points="218,74 184,118 160,108 188,62" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <polygon points="218,182 188,194 160,148 184,138" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <polygon points="128,224 108,182 128,164 148,182" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <polygon points="38,182 72,138 96,148 68,194" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <polygon points="38,74 68,62 96,108 72,118" fill="url(#aeg-plate)" stroke="#00ffcc" stroke-width="2"/>
            <!-- Central Hexagonal Frigate Hull -->
            <polygon points="128,54 192,91 192,165 128,202 64,165 64,91" fill="url(#aeg-hull)" stroke="#00ffcc" stroke-width="2.5"/>
            <polygon points="128,68 178,97 178,159 128,188 78,159 78,97" fill="url(#aeg-plate)" stroke="#bf00ff" stroke-width="1.8"/>
            <!-- Emitter Nodes -->
            <circle cx="128" cy="36" r="6" fill="#00ffcc" filter="url(#aeg-glow)"/>
            <circle cx="204" cy="82" r="6" fill="#00ffcc" filter="url(#aeg-glow)"/>
            <circle cx="204" cy="174" r="6" fill="#00ffcc" filter="url(#aeg-glow)"/>
            <circle cx="52" cy="82" r="6" fill="#00ffcc" filter="url(#aeg-glow)"/>
            <circle cx="52" cy="174" r="6" fill="#00ffcc" filter="url(#aeg-glow)"/>
            <!-- Sanctuary Core & Canopy -->
            <circle cx="128" cy="128" r="28" fill="url(#aeg-core)" filter="url(#aeg-glow)"/>
            <polygon points="128,96 156,112 156,144 128,160 100,144 100,112" fill="url(#aeg-glass)" stroke="#ffffff" stroke-width="2"/>
            <circle cx="128" cy="128" r="10" fill="#ffffff"/>
        </g>
    </svg>