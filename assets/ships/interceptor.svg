<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="int-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="int-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="int-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="int-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="int-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#00f0ff"/>
            <stop offset="80%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="int-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff"/>
            <stop offset="50%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#00f0ff"/>
        </linearGradient>
        <radialGradient id="int-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#80ffff"/>
            <stop offset="75%" stop-color="#0066ff" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="int-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#0066ff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="int-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#00f0ff"/>
            <stop offset="70%" stop-color="#0066ff" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="int-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#00f0ff" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#0066ff" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="112" fill="url(#int-aura)"/>
        <!-- Twin Ion Thruster Plumes -->
        <g filter="url(#int-glow)">
            <polygon points="96,204 104,250 112,204" fill="url(#int-plume)"/>
            <polygon points="144,204 152,250 160,204" fill="url(#int-plume)"/>
            <polygon points="100,204 104,234 108,204" fill="#ffffff"/>
            <polygon points="148,204 152,234 156,204" fill="#ffffff"/>
        </g>
        <!-- Dual Forward Laser Cannon Barrels -->
        <g stroke="#00f0ff" stroke-width="1.5">
            <rect x="64" y="42" width="6" height="58" rx="3" fill="#18263a"/>
            <rect x="186" y="42" width="6" height="58" rx="3" fill="#18263a"/>
            <circle cx="67" cy="42" r="4" fill="#ffffff" filter="url(#int-glow)"/>
            <circle cx="189" cy="42" r="4" fill="#ffffff" filter="url(#int-glow)"/>
        </g>
        <!-- Main Swept Twin-Wing Stealth Chassis -->
        <g filter="url(#int-shadow)">
            <!-- Underwing Dark Carbon Frame -->
            <polygon points="128,16 168,94 238,166 218,194 162,172 146,208 110,208 94,172 38,194 18,166 88,94" fill="url(#int-hull)" stroke="#00f0ff" stroke-width="2"/>
            <!-- Forward Canards -->
            <polygon points="106,62 66,92 74,106 112,88" fill="url(#int-plate)" stroke="#00f0ff" stroke-width="1.4"/>
            <polygon points="150,62 190,92 182,106 144,88" fill="url(#int-plate)" stroke="#00f0ff" stroke-width="1.4"/>
            <!-- Main Aero Armor Plates -->
            <polygon points="128,22 158,98 224,162 198,176 154,148 128,188 102,148 58,176 32,162 98,98" fill="url(#int-plate)" stroke="#00c8ff" stroke-width="1.6"/>
            <!-- Cyber-Cyan Energy Trim Strips -->
            <polygon points="128,30 144,86 196,154 182,160 138,108 128,62 118,108 74,160 60,154 112,86" fill="url(#int-accent)" opacity="0.9"/>
            <!-- Center Fuselage Spine -->
            <polygon points="128,14 144,74 140,196 128,212 116,196 112,74" fill="url(#int-plate)" stroke="#80f8ff" stroke-width="1.5"/>
            <!-- Panel Seam Lines -->
            <path d="M128,26 L128,198 M96,112 L52,158 M160,112 L204,158 M104,144 L152,144" stroke="#00f0ff" stroke-width="1" opacity="0.55" fill="none"/>
            <!-- Twin Engine Nacelles -->
            <rect x="94" y="188" width="20" height="20" rx="4" fill="#0d1522" stroke="#00f0ff" stroke-width="1.8"/>
            <rect x="142" y="188" width="20" height="20" rx="4" fill="#0d1522" stroke="#00f0ff" stroke-width="1.8"/>
            <!-- Glowing Cockpit Canopy -->
            <polygon points="128,58 140,94 136,134 128,146 120,134 116,94" fill="url(#int-glass)" stroke="#ffffff" stroke-width="1.5"/>
            <polygon points="126,68 133,94 130,118 124,94" fill="#ffffff" opacity="0.65"/>
            <!-- Reactor Core -->
            <circle cx="128" cy="164" r="12" fill="url(#int-core)" filter="url(#int-glow)"/>
            <circle cx="128" cy="164" r="5" fill="#ffffff"/>
        </g>
    </svg>