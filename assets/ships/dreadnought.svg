<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
        
    <defs>
        <filter id="drd-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
            <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
            <feMerge>
                <feMergeNode in="blur2"/>
                <feMergeNode in="blur1"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="drd-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.78"/>
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffaa00" flood-opacity="0.45"/>
        </filter>
        <linearGradient id="drd-hull" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2b3548"/>
            <stop offset="35%" stop-color="#182030"/>
            <stop offset="70%" stop-color="#0d121c"/>
            <stop offset="100%" stop-color="#060910"/>
        </linearGradient>
        <linearGradient id="drd-plate" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#121824"/>
            <stop offset="25%" stop-color="#2c3a50"/>
            <stop offset="50%" stop-color="#435674"/>
            <stop offset="75%" stop-color="#2c3a50"/>
            <stop offset="100%" stop-color="#121824"/>
        </linearGradient>
        <linearGradient id="drd-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="25%" stop-color="#ffaa00"/>
            <stop offset="80%" stop-color="#ff4400"/>
            <stop offset="100%" stop-color="#050811"/>
        </linearGradient>
        <linearGradient id="drd-trim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffaa00"/>
            <stop offset="50%" stop-color="#ff4400"/>
            <stop offset="100%" stop-color="#ffaa00"/>
        </linearGradient>
        <radialGradient id="drd-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="35%" stop-color="#ffee88"/>
            <stop offset="75%" stop-color="#ff4400" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="drd-aura" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.26"/>
            <stop offset="65%" stop-color="#ff4400" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="drd-plume" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="30%" stop-color="#ffaa00"/>
            <stop offset="70%" stop-color="#ff4400" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="drd-glass" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="28%" stop-color="#ffaa00" stop-opacity="0.85"/>
            <stop offset="70%" stop-color="#06152d" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#ff4400" stop-opacity="0.9"/>
        </linearGradient>
    </defs>
        <circle cx="128" cy="128" r="116" fill="url(#drd-aura)"/>
        <!-- Quad Heavy Thruster Plumes -->
        <g filter="url(#drd-glow)">
            <polygon points="62,208 70,248 78,208" fill="url(#drd-plume)"/>
            <polygon points="96,212 106,254 116,212" fill="url(#drd-plume)"/>
            <polygon points="140,212 150,254 160,212" fill="url(#drd-plume)"/>
            <polygon points="178,208 186,248 194,208" fill="url(#drd-plume)"/>
        </g>
        <g filter="url(#drd-shadow)">
            <!-- Heavy Broadside Hull -->
            <polygon points="96,24 160,24 192,66 232,118 226,188 198,212 58,212 30,188 24,118 64,66" fill="url(#drd-hull)" stroke="#ffaa00" stroke-width="2.5"/>
            <!-- Reactive Armor Shoulder Plates -->
            <polygon points="64,62 102,42 106,196 42,184 34,122" fill="url(#drd-plate)" stroke="#ffaa00" stroke-width="1.8"/>
            <polygon points="192,62 154,42 150,196 214,184 222,122" fill="url(#drd-plate)" stroke="#ffaa00" stroke-width="1.8"/>
            <!-- Gold/Amber Armor Chevrons -->
            <polygon points="46,112 94,88 94,110 46,134" fill="url(#drd-accent)"/>
            <polygon points="46,144 94,120 94,142 46,166" fill="url(#drd-accent)"/>
            <polygon points="210,112 162,88 162,110 210,134" fill="url(#drd-accent)"/>
            <polygon points="210,144 162,120 162,142 210,166" fill="url(#drd-accent)"/>
            <!-- Central Command Citadel -->
            <polygon points="104,20 152,20 166,76 160,208 96,208 90,76" fill="url(#drd-plate)" stroke="#ffd266" stroke-width="2"/>
            <!-- Dual Forward Siege Breacher Prongs -->
            <rect x="102" y="12" width="14" height="32" rx="3" fill="#2c3545" stroke="#ffaa00" stroke-width="1.8"/>
            <rect x="140" y="12" width="14" height="32" rx="3" fill="#2c3545" stroke="#ffaa00" stroke-width="1.8"/>
            <!-- Dual Plasma Artillery Turrets (Left & Right) -->
            <g>
                <rect x="64" y="54" width="6" height="36" rx="2" fill="#ffe088" stroke="#ff6600" stroke-width="1.2"/>
                <rect x="74" y="54" width="6" height="36" rx="2" fill="#ffe088" stroke="#ff6600" stroke-width="1.2"/>
                <circle cx="72" cy="92" r="16" fill="#1c2432" stroke="#ffaa00" stroke-width="2.2"/>
                <circle cx="72" cy="92" r="7" fill="url(#drd-core)"/>
                <rect x="176" y="54" width="6" height="36" rx="2" fill="#ffe088" stroke="#ff6600" stroke-width="1.2"/>
                <rect x="186" y="54" width="6" height="36" rx="2" fill="#ffe088" stroke="#ff6600" stroke-width="1.2"/>
                <circle cx="184" cy="92" r="16" fill="#1c2432" stroke="#ffaa00" stroke-width="2.2"/>
                <circle cx="184" cy="92" r="7" fill="url(#drd-core)"/>
            </g>
            <!-- Micro-Missile Silo Grid -->
            <g fill="#ff5500" stroke="#ffd700" stroke-width="1">
                <rect x="52" y="168" width="8" height="8" rx="2"/><rect x="64" y="168" width="8" height="8" rx="2"/><rect x="76" y="168" width="8" height="8" rx="2"/>
                <rect x="172" y="168" width="8" height="8" rx="2"/><rect x="184" y="168" width="8" height="8" rx="2"/><rect x="196" y="168" width="8" height="8" rx="2"/>
            </g>
            <!-- Armored Bridge Visor & Furnace Reactor -->
            <polygon points="110,66 146,66 152,92 104,92" fill="url(#drd-glass)" stroke="#ffffff" stroke-width="1.6"/>
            <circle cx="128" cy="142" r="22" fill="#111722" stroke="#ffaa00" stroke-width="2.5"/>
            <circle cx="128" cy="142" r="15" fill="url(#drd-core)" filter="url(#drd-glow)"/>
            <path d="M113,142 L143,142 M128,127 L128,157" stroke="#ffffff" stroke-width="2"/>
        </g>
    </svg>