<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COSMIC SURVIVORS v12.0 — Evrim Ağacı &amp; Sentez Laboratuvarı</title>
    <meta name="description" content="COSMIC SURVIVORS v12.0 Genesis Edition: 8 yıldız gemisi, 14 silah, 14 destek modülü, 19 evrim ve 6 mega evrim arasındaki tüm matematiksel sentez bağlarını keşfedin.">
    <meta name="theme-color" content="#070b12">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/tree.css">
</head>
<body class="tree-app">
    <!-- Unified v12.0 Compact Topbar (6 Navigation Links + EN/TR Toggle + Audio + Credits) -->
    <header class="cosmic-topbar">
        <a href="index.html" class="topbar-brand">
            <img src="assets/icon-192.png" alt="Cosmic Universe v12 Emblem" class="topbar-logo-img">
            <div class="topbar-title-wrap">
                <span class="topbar-title">COSMIC UNIVERSE</span>
                <span class="topbar-version">V12.0 EVOLUTION LAB</span>
            </div>
        </a>

        <nav class="topbar-nav" aria-label="Ana Sayfalar">
            <a href="index.html" class="topbar-link">
                <i data-lucide="layout-grid"></i>
                <span data-i18n="nav.portalLink">Portal</span>
            </a>
            <a href="story.html" class="topbar-link">
                <i data-lucide="compass"></i>
                <span data-i18n="nav.story">Hikâye</span>
            </a>
            <a href="hangar.html" class="topbar-link">
                <i data-lucide="rocket"></i>
                <span data-i18n="nav.hangar">Survivors</span>
            </a>
            <a href="tree.html" class="topbar-link active" aria-current="page">
                <i data-lucide="git-branch"></i>
                <span data-i18n="nav.tree">Evrim Ağacı</span>
            </a>
            <a href="wiki.html" class="topbar-link">
                <i data-lucide="book-open"></i>
                <span data-i18n="nav.wiki">Ansiklopedi</span>
            </a>
            <a href="about.html" class="topbar-link">
                <i data-lucide="info"></i>
                <span data-i18n="nav.about">Hakkında</span>
            </a>
        </nav>

        <div class="topbar-actions">
            <div class="credits-pill" title="Araştırma Kredisi">
                <i data-lucide="coins"></i>
                <span id="creditsDisplay">0</span>
                <span class="hide-mobile">CRD</span>
            </div>
            <button type="button" id="langToggleBtn" class="lang-toggle-btn" data-lang="tr" aria-label="Dil Değiştir / Switch Language" title="EN / TR">
                <span class="lang-seg" data-lang="en">EN</span>
                <span class="lang-sep">/</span>
                <span class="lang-seg active" data-lang="tr">TR</span>
            </button>
            <button type="button" id="audioToggleBtn" class="audio-toggle-btn" aria-label="Ses Aç/Kapat">
                <i data-lucide="volume-2" id="audioToggleIcon"></i>
                <span class="hide-mobile" id="audioToggleLabel" data-i18n="common.audioOn">Ses Açık</span>
            </button>
        </div>
    </header>

    <!-- 8-Ship Selector & Legend -->
    <div class="tree-ship-bar">
        <div id="shipSelectorBar" class="ship-tabs-scroll" role="tablist" aria-label="Gemi Ağaçları"></div>

        <div class="tree-legend-strip">
            <span><span class="legend-dot" style="background:var(--accent-sky);"></span><span data-i18n="tree.legend.sig">İmza Kök</span></span>
            <span><span class="legend-dot" style="background:var(--accent-mint);"></span><span data-i18n="tree.legend.univ">Evrensel</span></span>
            <span><span class="legend-dot" style="background:var(--accent-amber);"></span><span data-i18n="tree.legend.mega">Mega Evrim</span></span>
            <button type="button" id="toggleAllSigsBtn" class="cs-btn cs-btn-ghost" style="padding:0.35rem 0.7rem;font-size:12px;">
                <i data-lucide="layers"></i>
                <span id="toggleAllSigsLabel" data-i18n="tree.viewShip">Seçili Gemi Görünümü</span>
            </button>
        </div>
    </div>

    <main class="tree-workspace">
        <!-- Panzoom Viewport -->
        <section id="treeViewport" class="tree-viewport" aria-label="İnteraktif Evrim Şeması">
            <div class="tree-toolbar">
                <div class="tree-zoom-group">
                    <button type="button" id="zoomOutBtn" class="tree-tool-btn" title="Uzaklaş" data-i18n-title="tree.zoomOut">
                        <i data-lucide="zoom-out"></i>
                    </button>
                    <span id="zoomReadout" class="tree-zoom-readout">100%</span>
                    <button type="button" id="zoomInBtn" class="tree-tool-btn" title="Yakınlaş" data-i18n-title="tree.zoomIn">
                        <i data-lucide="zoom-in"></i>
                    </button>
                    <button type="button" id="zoomResetBtn" class="tree-tool-btn" title="Sıfırla" data-i18n-title="tree.reset">
                        <i data-lucide="maximize-2"></i>
                        <span data-i18n="tree.reset">Sıfırla</span>
                    </button>
                </div>

                <div class="tree-search-wrap" role="search">
                    <i data-lucide="search" class="tree-search-icon"></i>
                    <input
                        type="search"
                        id="treeSearchInput"
                        class="tree-search-input"
                        placeholder="Bulanık ara: takyon, hyperion, gatling..."
                        data-i18n-placeholder="tree.searchPlaceholder"
                        autocomplete="off"
                        aria-label="Evrim Ağacında Bulanık Arama"
                    >
                    <span id="treeSearchCount" class="tree-search-count font-mono" hidden>0</span>
                    <button type="button" id="treeSearchClearBtn" class="tree-search-clear" hidden aria-label="Temizle">
                        <i data-lucide="x"></i>
                    </button>
                    <div id="treeSearchResults" class="tree-search-results" role="listbox" hidden></div>
                </div>
            </div>

            <div class="tree-hint-pill">
                <i data-lucide="move" style="width:13px;height:13px;margin-right:4px;"></i>
                <span data-i18n="tree.hint">Sürükleyerek kaydırın · Fare tekerleğiyle yakınlaştırın · Sentez zinciri için düğüme tıklayın</span>
            </div>

            <div id="treeCanvas" class="tree-canvas-stage">
                <svg id="svgConnections" class="tree-svg-layer" aria-hidden="true"></svg>
                <div id="treeColumns" class="tree-columns">
                    <div id="colWeapons" class="tree-col"></div>
                    <div id="colTrinkets" class="tree-col"></div>
                    <div id="colEvolutions" class="tree-col"></div>
                    <div id="colMegaEvolutions" class="tree-col"></div>
                </div>
            </div>
        </section>

        <!-- Right Telemetry Inspector -->
        <aside class="tree-inspector" aria-label="Modül Telemetri Denetçisi">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">
                <span id="inspectorScopeBadge" class="cs-badge cs-badge-sky font-mono">İMZA SİSTEM</span>
                <span id="inspectorTierBadge" class="cs-badge cs-badge-amber font-mono">S+</span>
            </div>

            <div>
                <h1 id="inspectorTitle" style="font-size:20px;font-weight:700;">Takyon Mızrağı</h1>
                <p id="inspectorDesc" style="margin-top:0.35rem;font-size:13.5px;"></p>
            </div>

            <div class="holo-preview-box">
                <canvas id="holoEffectCanvas" width="320" height="175"></canvas>
            </div>

            <div id="inspectorStatsGrid" class="inspector-stat-grid"></div>

            <div id="inspectorFormulaBox" class="chain-formula-box"></div>

            <!-- Interactive Quick Synthesis Tester -->
            <div class="quick-synth-box">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <strong style="font-family:var(--font-display);font-size:13.5px;" data-i18n="tree.quickSynthTitle">Hızlı Sentez Doğrulayıcı</strong>
                    <span class="cs-badge cs-badge-mint font-mono">X + Y = Z</span>
                </div>

                <select id="calcWeaponSelect" class="cs-select" aria-label="Silah Seçimi"></select>
                <select id="calcTrinketSelect" class="cs-select" aria-label="Destek Modülü Seçimi"></select>

                <div id="calcSynthResult" class="quick-synth-result"></div>
            </div>
        </aside>
    </main>

    <script src="vendor/lucide.min.js"></script>
    <script src="vendor/panzoom.min.js"></script>
    <script src="vendor/fuse.min.js"></script>
    <script src="vendor/howler.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/data.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/tree.js"></script>
</body>
</html>
